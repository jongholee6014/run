<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 July Running Record</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    
    /* background.jpg 배경 이미지 설정 */
    body {
      background-image: linear-gradient(rgba(17, 24, 39, 0.85), rgba(17, 24, 39, 0.85)), url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #111827;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .card {
      background: rgba(31, 41, 55, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      padding: 20px 24px;
    }
    
    .header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
      align-items: center;
    }
    
    .header h2 {
      margin: 0;
      color: #f9fafb;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding-bottom: 6px;
      border-bottom: 3px solid #00f2fe;
      display: inline-block;
    }
    
    .cumulative-summary {
      font-size: 0.95rem;
      color: #9ca3af;
      font-weight: 500;
    }
    
    .cumulative-summary span {
      color: #00f2fe;
      font-weight: 700;
      font-size: 1.15rem;
    }
    
    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
      margin-top: 12px;
    }
    
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    .input-section h3 {
      margin: 0;
      font-size: 1rem;
      color: #f3f4f6;
      border-left: 4px solid #00f2fe;
      padding-left: 10px;
    }
    
    .form-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .field label {
      font-size: 0.85rem;
      color: #9ca3af;
      font-weight: 600;
    }
    
    select, input {
      padding: 10px 14px;
      background-color: #374151;
      border: 1px solid #4b5563;
      border-radius: 8px;
      color: #f9fafb;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    
    select:focus, input:focus {
      border-color: #4facfe;
      box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
    }
    
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      align-self: flex-end;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 242, 254, 0.2);
    }
    
    .btn:hover {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header">
        <h2>2026 July Running Record</h2>
        <div class="cumulative-summary">
          Cumulative Distance: <span id="totalDistance">0.0 km</span>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="runningChart"></canvas>
      </div>
    </div>

    <!-- Daily Log Input Card -->
    <div class="card input-section">
      <h3>✍️ Daily Log Input</h3>
      <div class="form-group">
        <div class="field">
          <label for="daySelect">Select Date</label>
          <select id="daySelect"></select>
        </div>
        <div class="field">
          <label for="distanceInput">Distance (km)</label>
          <input type="number" id="distanceInput" min="0" step="0.1" placeholder="e.g. 5.0" autofocus>
        </div>
        <button class="btn" onclick="addRecord()">Save Record</button>
      </div>
    </div>
  </div>

  <script>
    const days = Array.from({ length: 30 }, (_, i) => `Day ${i + 1}`);
    
    // July 2026 Actual Running Data
    const dailyDistances = [
      0, 6.2, 0, 8.0, 0, 0, 6.7, 0, 7.3, 7.6,
      5.8, 7.2, 0, 6.3, 0, 6.9, 6.5, 5.5, 6.1, 7.1,
      0, 6.1, 7.0, 5.5, 8.1, 0, 0, 0, 0, 0
    ];

    function calculateAccumulated(dailyArray) {
      return dailyArray.reduce((acc, curr, i) => {
        const prev = i > 0 ? acc[i - 1] : 0;
        acc.push(Number((prev + curr).toFixed(1)));
        return acc;
      }, []);
    }

    function updateSummaryDisplay(accumulatedArray) {
      const total = accumulatedArray[accumulatedArray.length - 1] || 0;
      document.getElementById('totalDistance').textContent = `${total.toFixed(1)} km`;
    }

    const ctx = document.getElementById('runningChart').getContext('2d');
    
    const cumulativeGradient = ctx.createLinearGradient(0, 0, 0, 220);
    cumulativeGradient.addColorStop(0, 'rgba(0, 242, 254, 0.2)');
    cumulativeGradient.addColorStop(1, 'rgba(0, 242, 254, 0.05)');

    const accumulatedData = calculateAccumulated(dailyDistances);

    const runningChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: days,
        datasets: [
          {
            type: 'line',
            label: 'Monthly Cumulative (km)',
            data: accumulatedData,
            borderColor: '#00f2fe',
            borderWidth: 2.5,
            backgroundColor: cumulativeGradient,
            fill: true,
            tension: 0.3,
            pointBackgroundColor: '#00f2fe',
            pointBorderColor: '#1f2937',
            pointBorderWidth: 1.5,
            pointRadius: 3,
            order: 1
          },
          {
            type: 'bar',
            label: 'Daily Running (km)',
            data: dailyDistances,
            backgroundColor: 'rgba(239, 68, 68, 0.75)',
            borderColor: '#ef4444',
            borderWidth: 1,
            borderRadius: 4,
            order: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index',
            intersect: false,
            backgroundColor: '#111827',
            callbacks: {
              label: (context) => `${context.dataset.label}: ${context.raw.toFixed(1)} km`
            }
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(75, 85, 99, 0.2)' },
            ticks: {
              color: '#9ca3af',
              font: { size: 10, weight: '600' },
              callback: function(val, index) {
                const dayNumber = index + 1;
                return dayNumber % 2 !== 0 ? `Day ${dayNumber}` : '';
              }
            }
          },
          y: {
            beginAtZero: true,
            max: 150,
            title: { display: true, text: 'Distance (km)', color: '#9ca3af', font: { size: 11 } },
            grid: { color: 'rgba(75, 85, 99, 0.2)' },
            ticks: { color: '#9ca3af', stepSize: 30, font: { size: 10 } }
          }
        }
      }
    });

    updateSummaryDisplay(accumulatedData);

    const daySelect = document.getElementById('daySelect');
    const distanceInput = document.getElementById('distanceInput');

    // 드롭다운 옵션 생성
    days.forEach((day, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = day;
      daySelect.appendChild(option);
    });

    // 오늘 날짜 계산 (7월 기준, 범위를 넘어가지 않도록 설정)
    const today = new Date();
    const currentDayIndex = Math.min(today.getDate() - 1, days.length - 1);

    // 기본 선택값을 오늘 날짜로 설정
    daySelect.value = currentDayIndex;
    distanceInput.value = dailyDistances[currentDayIndex];

    daySelect.addEventListener('change', (e) => {
      const idx = e.target.value;
      distanceInput.value = dailyDistances[idx] || '';
    });

    function addRecord() {
      const selectedIndex = parseInt(daySelect.value);
      const inputVal = parseFloat(distanceInput.value);

      if (isNaN(inputVal) || inputVal < 0) {
        alert('Please enter a valid distance.');
        return;
      }

      dailyDistances[selectedIndex] = inputVal;
      const newAccumulated = calculateAccumulated(dailyDistances);

      runningChart.data.datasets[1].data = dailyDistances;
      runningChart.data.datasets[0].data = newAccumulated;
      runningChart.update();

      updateSummaryDisplay(newAccumulated);
    }
  </script>
</body>
</html>
